/* js/store.js */
/*
 * Persistence. Everything lives in one localStorage record so it can be
 * exported/imported as a single JSON backup. If storage is unavailable
 * (private mode, blocked site data) the app still works in memory.
 */
window.IB = window.IB || {};

IB.store = (function () {
  const KEY = 'ib-toolkit.v1';
  const DEFAULTS = () => ({
    version: 1,
    cards: {},          // question id -> SRS state
    custom: [],         // user-added questions
    days: {},           // 'YYYY-MM-DD' -> { reviews, newSeen }
    superdays: [],      // mock interview history
    settings: { newPerDay: 15, targetDate: '', timer: 90, excludeFit: false }
  });

  let state = DEFAULTS();
  let persistent = true;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        const d = DEFAULTS();
        state = Object.assign(d, parsed);
        state.settings = Object.assign(d.settings, parsed.settings || {});
      }
    } catch (e) {
      persistent = false;
    }
    return state;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      persistent = false;
    }
  }

  function get() { return state; }

  function day(key) {
    key = key || IB.util.todayKey();
    if (!state.days[key]) state.days[key] = { reviews: 0, newSeen: 0 };
    return state.days[key];
  }

  function exportJSON() {
    return JSON.stringify(Object.assign({ exportedAt: new Date().toISOString() }, state), null, 2);
  }

  function importJSON(text) {
    const parsed = JSON.parse(text);
    if (!parsed || typeof parsed !== 'object' || !parsed.cards) {
      throw new Error('This file does not look like a toolkit backup.');
    }
    const d = DEFAULTS();
    state = Object.assign(d, parsed);
    state.settings = Object.assign(d.settings, parsed.settings || {});
    delete state.exportedAt;
    save();
  }

  function reset() {
    const settings = state.settings;
    const custom = state.custom;
    state = DEFAULTS();
    state.settings = settings;
    state.custom = custom;
    save();
  }

  return { load, save, get, day, exportJSON, importJSON, reset, isPersistent: () => persistent };
})();

</script>
  <script>
/* js/srs.js */
/*
 * Spaced repetition (a simplified SM-2).
 *
 * Each card keeps: ease, interval (days), due (ms timestamp), reps, lapses.
 * Ratings: 0 = Again, 1 = Hard, 2 = Good, 3 = Easy.
 * A card is "mastered" once its interval reaches MASTERED_DAYS.
 */
window.IB = window.IB || {};

IB.srs = (function () {
  const { DAY } = IB.util;
  const MIN_EASE = 1.3;
  const AGAIN_DELAY = 10 * 60 * 1000;
  const MASTERED_DAYS = 21;

  function allQuestions() {
    const st = IB.store.get();
    const priv = (IB.PRIVATE_QUESTIONS || []).map((q, i) => Object.assign({ id: 'priv-' + i, s: 'private', d: 2 }, q));
    const custom = (st.custom || []).map(q => Object.assign({ s: 'mine', d: 2 }, q));
    return IB.QUESTIONS.concat(priv, custom);
  }

  function byId(id) { return allQuestions().find(q => q.id === id); }

  function card(id) { return IB.store.get().cards[id]; }

  function isNew(id) { return !card(id); }

  // What the next interval would be for each rating (used for button labels).
  function preview(id) {
    return [0, 1, 2, 3].map(r => next(card(id), r).interval);
  }

  function next(c, rating) {
    c = c ? Object.assign({}, c) : { ease: 2.5, interval: 0, reps: 0, lapses: 0 };
    if (rating === 0) {
      c.lapses += 1;
      c.reps = 0;
      c.interval = 0;
      c.ease = Math.max(MIN_EASE, c.ease - 0.2);
      c.due = Date.now() + AGAIN_DELAY;
    } else {
      let ivl;
      if (rating === 1) {
        ivl = c.reps === 0 ? 1 : Math.max(c.interval + 1, Math.round(c.interval * 1.2));
        c.ease = Math.max(MIN_EASE, c.ease - 0.15);
      } else if (rating === 2) {
        ivl = c.reps === 0 ? 1 : c.reps === 1 ? 3 : Math.round(c.interval * c.ease);
      } else {
        ivl = c.reps === 0 ? 4 : Math.round(Math.max(c.interval, 1) * c.ease * 1.3);
        c.ease += 0.15;
      }
      c.interval = Math.max(1, ivl);
      c.reps += 1;
      c.due = IB.util.startOfDay() + c.interval * DAY;
    }
    c.last = Date.now();
    c.lastRating = rating;
    return c;
  }

  function review(id, rating) {
    const st = IB.store.get();
    const wasNew = !st.cards[id];
    st.cards[id] = next(st.cards[id], rating);
    const day = IB.store.day();
    day.reviews += 1;
    if (wasNew) day.newSeen += 1;
    IB.store.save();
    return st.cards[id];
  }

  function status(id) {
    const c = card(id);
    if (!c) return 'new';
    if (c.interval >= MASTERED_DAYS) return 'mastered';
    return 'learning';
  }

  function dueIds(now) {
    now = now || Date.now();
    const st = IB.store.get();
    const valid = new Set(allQuestions().map(q => q.id));
    return Object.keys(st.cards)
      .filter(id => valid.has(id) && st.cards[id].due <= now)
      .sort((a, b) => st.cards[a].due - st.cards[b].due);
  }

  function newIds(topics) {
    const st = IB.store.get();
    return allQuestions()
      .filter(q => !st.cards[q.id] && (!topics || topics.includes(q.t)))
      .sort((a, b) => (a.d - b.d) || 0)
      .map(q => q.id);
  }

  function newRemainingToday() {
    const st = IB.store.get();
    return Math.max(0, st.settings.newPerDay - IB.store.day().newSeen);
  }

  // Recommended new cards per day to finish the bank by the target date.
  function pace() {
    const st = IB.store.get();
    if (!st.settings.targetDate) return null;
    const daysLeft = IB.util.daysBetween(IB.util.todayKey(), st.settings.targetDate);
    const remaining = newIds().length;
    if (daysLeft <= 0) return { daysLeft, remaining, perDay: remaining };
    return { daysLeft, remaining, perDay: Math.ceil(remaining / daysLeft) };
  }

  function topicStats() {
    const qs = allQuestions();
    const st = IB.store.get();
    return IB.TOPICS.map(t => {
      const items = qs.filter(q => q.t === t.id);
      let n = 0, learning = 0, mastered = 0, lapses = 0, seen = 0;
      items.forEach(q => {
        const s = status(q.id);
        if (s === 'new') n++;
        else {
          seen++;
          lapses += st.cards[q.id].lapses;
          if (s === 'mastered') mastered++; else learning++;
        }
      });
      // Weakness score: share of reviewed cards that were missed, weighted toward low mastery.
      const weakness = seen ? (lapses / seen) + (1 - mastered / items.length) * 0.5 : null;
      return Object.assign({}, t, { total: items.length, new: n, learning, mastered, seen, lapses, weakness });
    });
  }

  function streak() {
    const days = IB.store.get().days;
    let count = 0;
    const d = new Date();
    // Today counts if studied; otherwise the streak can still be alive from yesterday.
    if (!(days[IB.util.todayKey(d)] && days[IB.util.todayKey(d)].reviews)) d.setDate(d.getDate() - 1);
    while (days[IB.util.todayKey(d)] && days[IB.util.todayKey(d)].reviews > 0) {
      count++;
      d.setDate(d.getDate() - 1);
    }
    return count;
  }

  return { allQuestions, byId, card, isNew, preview, review, status, dueIds, newIds, newRemainingToday, pace, topicStats, streak, MASTERED_DAYS };
})();

</script>

/* js/calc.js */
/*
 * Pure valuation math (no DOM), so it can be unit-tested with Node.
 * All rates are decimals (0.10 = 10%). Cash flows are end-of-year.
 */
(function (root) {
  const IB = root.IB = root.IB || {};

  /* ───────── DCF (FCFF / WACC, as in SIB 4) ───────── */
  function dcf(p) {
    const rows = [];
    let prevRev = p.rev0;
    let sumPV = 0;
    for (let y = 1; y <= p.years; y++) {
      const rev = prevRev * (1 + p.growth);
      const ebit = rev * p.margin;
      const nopat = ebit * (1 - p.tax);
      const da = rev * p.daPct;
      const capex = rev * p.capexPct;
      const dnwc = (rev - prevRev) * p.nwcPct;
      const fcff = nopat + da - dnwc - capex;
      const df = 1 / Math.pow(1 + p.wacc, y);
      const pv = fcff * df;
      sumPV += pv;
      rows.push({ year: y, rev, ebit, ebitda: ebit + da, nopat, da, capex, dnwc, fcff, df, pv });
      prevRev = rev;
    }
    const last = rows[rows.length - 1];
    const warnings = [];
    let tv;
    if (p.tvMethod === 'mult') {
      tv = last.ebitda * p.exitMult;
    } else {
      tv = p.wacc > p.g ? last.fcff * (1 + p.g) / (p.wacc - p.g) : NaN;
      if (!(p.wacc > p.g)) warnings.push('Growth must be below WACC for a perpetuity.');
    }
    const pvTV = tv * last.df;
    const ev = sumPV + pvTV;
    const equity = ev + p.cash - p.debt;
    const perShare = p.shares > 0 ? equity / p.shares : NaN;
    const impliedMult = tv / last.ebitda;
    const impliedG = (tv * p.wacc - last.fcff) / (tv + last.fcff);

    if (isFinite(pvTV) && pvTV > 2 * sumPV) warnings.push(`PV of terminal value is ${(pvTV / sumPV).toFixed(1)}x the PV of the explicit period (class rule of thumb: no more than ~2x). Consider a longer explicit period.`);
    const gCheck = p.tvMethod === 'mult' ? impliedG : p.g;
    if (isFinite(gCheck) && gCheck > 0.03) warnings.push(`${p.tvMethod === 'mult' ? 'Implied perpetuity' : 'Perpetuity'} growth of ${(gCheck * 100).toFixed(1)}% is above long-run GDP growth (~2–3%).`);
    if (p.years < 5 || p.years > 10) warnings.push('Explicit period is usually 5–10 years.');

    return { rows, sumPV, tv, pvTV, ev, equity, perShare, impliedMult, impliedG, tvShare: pvTV / ev, warnings };
  }

  /* ───────── WACC with unlevered / relevered beta (β_debt = 0) ───────── */
  function wacc(p) {
    const betaA = p.betaE / (1 + (1 - p.tax) * p.deComp);
    const betaL = betaA * (1 + (1 - p.tax) * p.deTarget);
    const re = p.rf + betaL * p.mrp;
    const dv = p.deTarget / (1 + p.deTarget);
    const ev = 1 - dv;
    const rdAfter = p.rd * (1 - p.tax);
    return { betaA, betaL, re, dv, ev, rdAfter, wacc: ev * re + dv * rdAfter };
  }

  /* ───────── LBO (SIB 6 methodology) ───────── */
  function lbo(p) {
    const ev0 = p.ebitda0 * p.entryMult;
    const fees = ev0 * p.feesPct;
    const debt0 = p.ebitda0 * p.debtMult;
    const equity0 = ev0 + fees - debt0;
    const rows = [];
    let prev = p.ebitda0, debt = debt0, cash = 0;

    for (let y = 1; y <= p.years; y++) {
      const ebitda = prev * (1 + p.growth);
      const da = ebitda * p.daPct;
      const ebit = ebitda - da;
      const interest = debt * p.rate; // on beginning balance (avoids circularity)
      const ebt = ebit - interest;
      const tax = Math.max(0, ebt * p.tax);
      const ni = ebt - tax;
      const capex = ebitda * p.capexPct;
      const dnwc = (ebitda - prev) * p.nwcPct;
      const fcf = ni + da - capex - dnwc;
      const scheduled = p.mode === 'schedule' ? p.repay1 + p.step * (y - 1) : Math.max(0, fcf);
      const repay = Math.max(0, Math.min(debt, scheduled));
      const debtBeg = debt;
      debt -= repay;
      cash += fcf - repay;
      rows.push({ year: y, ebitda, da, ebit, interest, ebt, tax, ni, capex, dnwc, fcf, debtBeg, repay, debt, cash });
      prev = ebitda;
    }

    const last = rows[rows.length - 1];
    const exitCash = p.mode === 'schedule' ? p.exitCash : last.cash;
    const exitEV = last.ebitda * p.exitMult;
    const exitEquity = exitEV - last.debt + exitCash;
    const moic = exitEquity / equity0;
    const irr = moic > 0 ? Math.pow(moic, 1 / p.years) - 1 : -1;

    // Returns bridge: where the equity gain came from.
    const bridge = [
      ['EBITDA growth', (last.ebitda - p.ebitda0) * p.entryMult],
      ['Multiple expansion', (p.exitMult - p.entryMult) * last.ebitda],
      ['Debt paydown & cash', (debt0 - last.debt) + exitCash],
      ['Fees', -fees]
    ];

    const y1 = rows[0];
    const credit = [
      { label: 'Debt / EBITDA at entry', value: p.debtMult, fmt: 'x', ok: p.debtMult <= 6, rule: '≤ ~6x' },
      { label: 'EBITDA / interest (yr 1)', value: y1.ebitda / y1.interest, fmt: 'x', ok: y1.interest === 0 || y1.ebitda / y1.interest > 2, rule: '> 2x' },
      { label: '(EBITDA − CapEx) / interest (yr 1)', value: (y1.ebitda - y1.capex) / y1.interest, fmt: 'x', ok: y1.interest === 0 || (y1.ebitda - y1.capex) / y1.interest > 1.5, rule: '> 1.5x' },
      { label: 'Equity / total capitalization', value: equity0 / (equity0 + debt0), fmt: '%', ok: equity0 / (equity0 + debt0) > 0.4, rule: '> 40%' }
    ];

    const warnings = [];
    if (equity0 <= 0) warnings.push('Debt exceeds the purchase price plus fees: there is no equity check.');

    return { ev0, fees, debt0, equity0, rows, exitEV, exitCash, exitDebt: last.debt, exitEquity, moic, irr, bridge, credit, warnings };
  }

  // IRR for a single investment and single exit.
  function irrFromMoic(moic, years) { return Math.pow(moic, 1 / years) - 1; }

  IB.calc = { dcf, wacc, lbo, irrFromMoic };
  if (typeof module !== 'undefined') module.exports = IB.calc;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

    const st = IB.store.get();
    const all = IB.srs.allQuestions();
    const due = IB.srs.dueIds().length;
    const newLeft = Math.min(IB.srs.newRemainingToday(), IB.srs.newIds().length);
    const stats = IB.srs.topicStats();
    const mastered = stats.reduce((s, t) => s + t.mastered, 0);
    const seen = stats.reduce((s, t) => s + t.seen, 0);
    const streak = IB.srs.streak();
    const pace = IB.srs.pace();
    const today = IB.store.day();

    const weak = stats
      .filter(t => t.seen >= 3 && t.weakness !== null)
      .sort((a, b) => b.weakness - a.weakness)
      .slice(0, 3);

    const lastMock = st.superdays[st.superdays.length - 1];
    const el = document.createElement('div');
    root.replaceChildren(el);

    let paceHtml = '';
    if (pace) {
      const label = pace.daysLeft > 0
        ? `<strong>${pace.daysLeft}</strong> day${pace.daysLeft === 1 ? '' : 's'} to your target date`
        : 'Your target date is today or has passed';
      const advice = pace.remaining === 0
        ? 'You have seen every question. Keep up with reviews.'
        : `Learn about <strong>${pace.perDay}</strong> new question${pace.perDay === 1 ? '' : 's'}/day to see all ${pace.remaining} remaining in time` +
          (pace.perDay > st.settings.newPerDay ? ` <span class="chip warn">above your ${st.settings.newPerDay}/day setting</span>` : '') + '.';
      paceHtml = `<div class="card"><div class="row between"><div>${label}<div class="muted small">${advice}</div></div>
        ${pace.perDay > st.settings.newPerDay && pace.remaining ? `<button class="btn sm" data-act="matchpace">Set ${pace.perDay}/day</button>` : ''}</div></div>`;
    }

    el.innerHTML = `
      <div class="page-head">
        <h1>${greeting()}</h1>
        <p>${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })} · ${all.length} questions in your bank</p>
      </div>

      <div class="grid cols-4" style="margin-bottom:16px">
        <div class="stat"><div class="label">Due now</div><div class="value">${due}</div><div class="sub">reviews</div></div>
        <div class="stat"><div class="label">New today</div><div class="value">${newLeft}</div><div class="sub">of ${st.settings.newPerDay}/day</div></div>
        <div class="stat"><div class="label">Streak</div><div class="value">${streak}</div><div class="sub">day${streak === 1 ? '' : 's'}${today.reviews ? ' · ' + today.reviews + ' today' : ''}</div></div>
        <div class="stat"><div class="label">Mastered</div><div class="value">${mastered}</div><div class="sub">${pct(mastered / all.length, 0)} of bank · ${seen} seen</div></div>
      </div>

      <div class="card">
        <div class="row between">
          <div>
            <h2 style="margin:0">${due + newLeft > 0 ? 'Ready for today\'s session' : 'All caught up'}</h2>
            <div class="muted small">${due + newLeft > 0
              ? `${due} review${due === 1 ? '' : 's'} + ${newLeft} new question${newLeft === 1 ? '' : 's'}`
              : 'Nothing due. Drill a weak topic or run a mock superday.'}</div>
          </div>
          <div class="row">
            <a class="btn primary" href="#/study?mode=daily&run=1">${due + newLeft > 0 ? 'Start review' : 'Study anyway'}</a>
            <a class="btn" href="#/study?mode=superday">Mock superday</a>
          </div>
        </div>
      </div>

      ${paceHtml}

      <div class="card">
        <div class="row between" style="margin-bottom:6px">
          <h2 style="margin:0">Progress by topic</h2>
          <div class="legend"><span><i style="background:var(--mastered)"></i>Mastered</span><span><i style="background:var(--learning)"></i>Learning</span><span><i style="background:var(--new)"></i>New</span></div>
        </div>
        ${stats.map(t => `
          <div class="topic-row">
            <div><span class="name">${esc(t.name)}</span> <span class="counts">${t.mastered}/${t.total} mastered${t.lapses ? ` · ${t.lapses} miss${t.lapses === 1 ? '' : 'es'}` : ''}</span></div>
            <a class="btn sm" href="#/study?mode=drill&topic=${t.id}">Drill</a>
            <div class="bar" role="img" aria-label="${esc(t.name)}: ${t.mastered} mastered, ${t.learning} learning, ${t.new} new">
              <span class="m" style="width:${t.total ? t.mastered / t.total * 100 : 0}%"></span>
              <span class="l" style="width:${t.total ? t.learning / t.total * 100 : 0}%"></span>
            </div>
          </div>`).join('')}
      </div>

      <div class="grid cols-2 collapse">
        <div class="card">
          <h2>Weak spots</h2>
          ${weak.length ? `<ul class="flags">${weak.map(t => `<li><span class="chip bad">${t.lapses} miss${t.lapses === 1 ? '' : 'es'}</span><span><a href="#/study?mode=drill&topic=${t.id}">${esc(t.name)}</a> · ${t.mastered}/${t.total} mastered</span></li>`).join('')}</ul>`
            : '<p class="muted small">Review a few cards in each topic and your weakest areas will show up here.</p>'}
        </div>
        <div class="card">
          <h2>Last mock superday</h2>
          ${lastMock ? `<p style="margin:0"><strong>${lastMock.nailed}/${lastMock.total}</strong> nailed · ${lastMock.shaky} shaky · ${lastMock.missed} missed</p>
            <p class="muted small" style="margin:0">${new Date(lastMock.at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} · avg ${Math.round(lastMock.avgSeconds)}s per answer</p>`
            : '<p class="muted small">Timed, random questions answered out loud, like a real superday.</p>'}
        </div>
      </div>

      <details class="card" id="settings">
        <summary style="cursor:pointer;font-weight:700">Settings &amp; backup</summary>
        <div class="stack" style="margin-top:14px">
          <div class="grid cols-3">
            <label class="field">New questions per day
              <input type="number" min="0" max="200" id="set-new" value="${st.settings.newPerDay}">
            </label>
            <label class="field">Target date (first superday)
              <input type="date" id="set-target" value="${esc(st.settings.targetDate)}">
            </label>
            <label class="field">Superday answer timer (sec)
              <input type="number" min="15" max="600" step="15" id="set-timer" value="${st.settings.timer}">
            </label>
          </div>
          <div class="row">
            <span class="muted small">Theme</span>
            <div class="seg" id="theme">
              ${['auto', 'light', 'dark'].map(t => `<button data-theme="${t}" class="${(document.documentElement.dataset.theme || 'auto') === t ? 'on' : ''}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}
            </div>
          </div>
          <p class="muted small" style="margin:0">Progress is saved in this browser${IB.store.isPersistent() ? '' : ' <span class="chip warn">storage unavailable: progress will not persist</span>'}. Export a backup to move it to another device.</p>
          <div class="row">
            <button class="btn" data-act="export">Export backup</button>
            <label class="btn">Import backup<input type="file" accept="application/json,.json" id="import" hidden></label>
            <button class="btn danger" data-act="reset">Reset progress</button>
          </div>
        </div>
      </details>
    `;

    const save = () => { IB.store.save(); IB.util.toast('Saved'); };
    el.querySelector('#set-new').addEventListener('change', e => {
      st.settings.newPerDay = Math.max(0, Math.min(200, parseInt(e.target.value, 10) || 0)); save(); this.render(root); root.querySelector('#settings').open = true;
    });
    el.querySelector('#set-target').addEventListener('change', e => {
      st.settings.targetDate = e.target.value; save(); this.render(root); root.querySelector('#settings').open = true;
    });
    el.querySelector('#set-timer').addEventListener('change', e => {
      st.settings.timer = Math.max(15, Math.min(600, parseInt(e.target.value, 10) || 90)); save();
    });
    el.querySelector('#theme').addEventListener('click', e => {
      const t = e.target.dataset.theme;
      if (!t) return;
      IB.setTheme(t);
      el.querySelectorAll('#theme button').forEach(b => b.classList.toggle('on', b.dataset.theme === t));
    });
    el.querySelector('#import').addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      f.text().then(text => {
        try { IB.store.importJSON(text); IB.util.toast('Backup restored'); this.render(root); }
        catch (err) { alert(err.message); }
      });
    });
    el.addEventListener('click', e => {
      const act = e.target.closest('[data-act]');
      if (!act) return;
      if (act.dataset.act === 'export') {
        IB.util.download('ib-toolkit-backup-' + IB.util.todayKey() + '.json', IB.store.exportJSON());
      } else if (act.dataset.act === 'reset') {
        if (confirm('Reset all review progress? Your own questions and settings are kept.')) { IB.store.reset(); this.render(root); }
      } else if (act.dataset.act === 'matchpace' && pace) {
        st.settings.newPerDay = pace.perDay; save(); this.render(root);
      }
    });

    function greeting() {
      const h = new Date().getHours();
      return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    }
  }
};

/* Theme preference (auto / light / dark), stored per browser. */
IB.setTheme = function (t) {
  if (t === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  try { localStorage.setItem('ib-toolkit.theme', t); } catch (e) { /* ignore */ }
};
(function () {
  try {
    const t = localStorage.getItem('ib-toolkit.theme');
    if (t && t !== 'auto') document.documentElement.dataset.theme = t;
  } catch (e) { /* ignore */ }
})();

</script>
  <script>
/* js/views/study.js */
/*
 * Study: daily spaced-repetition review, topic drills, and timed mock superdays.
 */
window.IB = window.IB || {};
IB.views = IB.views || {};

IB.views.study = (function () {
  const { esc, md, shuffle, intervalLabel } = IB.util;
  const DIFF = { 1: 'Basic', 2: 'Intermediate', 3: 'Advanced' };
  const DRILL_SIZE = 20;

  const topicName = id => (IB.TOPICS.find(t => t.id === id) || { name: id }).name;

  function metaChips(q) {
    return `<span class="chip accent">${esc(topicName(q.t))}</span>
      <span class="chip">${DIFF[q.d] || 'Intermediate'}</span>
      <span class="chip">${esc(IB.SOURCES[q.s] || q.s)}</span>`;
  }

  /* ───────── Queue builders ───────── */
  function dailyQueue() {
    const due = IB.srs.dueIds();
    const fresh = IB.srs.newIds().slice(0, IB.srs.newRemainingToday());
    // Interleave: one new card after every two reviews so new material is spread out.
    const out = [];
    let i = 0, j = 0;
    while (i < due.length || j < fresh.length) {
      if (i < due.length) out.push(due[i++]);
      if (i < due.length) out.push(due[i++]);
      if (j < fresh.length) out.push(fresh[j++]);
    }
    return out;
  }

  function drillQueue(topic) {
    const qs = IB.srs.allQuestions().filter(q => q.t === topic);
    const now = Date.now();
    const groups = { due: [], learning: [], new: [], mastered: [] };
    qs.forEach(q => {
      const c = IB.srs.card(q.id);
      const s = IB.srs.status(q.id);
      if (c && c.due <= now) groups.due.push(q.id);
      else groups[s].push(q.id);
    });
    return [].concat(shuffle(groups.due), shuffle(groups.learning), groups.new, shuffle(groups.mastered)).slice(0, DRILL_SIZE);
  }

  function superdayQueue(topics, count) {
    const qs = IB.srs.allQuestions().filter(q => topics.includes(q.t));
    return shuffle(qs).slice(0, count).map(q => q.id);
  }

  /* ───────── Mode chooser ───────── */
  function chooser(el, preset) {
    const st = IB.store.get();
    const due = IB.srs.dueIds().length;
    const newLeft = Math.min(IB.srs.newRemainingToday(), IB.srs.newIds().length);
    let mode = preset || 'daily';

    el.innerHTML = `
      <div class="page-head"><h1>Study</h1><p>Answer out loud before revealing. Rate yourself honestly; the schedule adapts.</p></div>
      <div class="mode-grid" role="radiogroup" aria-label="Study mode">
        <button class="mode" data-mode="daily" role="radio"><h3>Daily review</h3><p>${due} due · ${newLeft} new. Spaced repetition brings back what you miss.</p></button>
        <button class="mode" data-mode="drill" role="radio"><h3>Drill a topic</h3><p>Up to ${DRILL_SIZE} cards from one topic, weakest first.</p></button>
        <button class="mode" data-mode="superday" role="radio"><h3>Mock superday</h3><p>Random timed questions. Grade yourself after each answer.</p></button>
      </div>
      <div class="card" id="opts" style="margin-top:16px"></div>`;

    const opts = el.querySelector('#opts');

    function paint() {
      el.querySelectorAll('.mode').forEach(b => {
        const on = b.dataset.mode === mode;
        b.classList.toggle('on', on);
        b.setAttribute('aria-checked', on);
      });
      if (mode === 'daily') {
        opts.innerHTML = `<div class="row between"><div><strong>${due + newLeft}</strong> card${due + newLeft === 1 ? '' : 's'} in today's session
          <div class="muted small">Change new cards per day in Home → Settings.</div></div>
          <button class="btn primary" data-go="daily" ${due + newLeft ? '' : 'disabled'}>Start</button></div>`;
      } else if (mode === 'drill') {
        opts.innerHTML = `<label class="field">Topic
          <select id="drill-topic">${IB.TOPICS.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label>
          <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn primary" data-go="drill">Start drill</button></div>`;
      } else {
        const defaults = IB.TOPICS.filter(t => !(st.settings.excludeFit && t.id === 'fit'));
        opts.innerHTML = `
          <div class="grid cols-2 collapse">
            <label class="field">Questions
              <select id="sd-count">${[5, 10, 15, 20].map(n => `<option ${n === 10 ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
            <label class="field">Seconds per answer
              <input type="number" id="sd-timer" min="15" max="600" step="15" value="${st.settings.timer}"></label>
          </div>
          <div style="margin-top:12px" class="field" role="group" aria-label="Topics"><span class="small" style="font-weight:600;color:var(--text-2)">Topics</span>
            <div class="topic-picks" style="margin-top:6px">${IB.TOPICS.map(t => `<label><input type="checkbox" value="${t.id}" ${defaults.includes(t) ? 'checked' : ''}>${esc(t.short)}</label>`).join('')}</div>
          </div>
          <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn primary" data-go="superday">Start mock</button></div>`;
      }
    }

    el.addEventListener('click', e => {
      const m = e.target.closest('.mode');
      if (m) { mode = m.dataset.mode; paint(); return; }
      const go = e.target.closest('[data-go]');
      if (!go) return;
      if (go.dataset.go === 'daily') IB.go('#/study?mode=daily&run=1');
      if (go.dataset.go === 'drill') IB.go('#/study?mode=drill&topic=' + el.querySelector('#drill-topic').value);
      if (go.dataset.go === 'superday') {
        const topics = [...el.querySelectorAll('.topic-picks input:checked')].map(i => i.value);
        if (!topics.length) { IB.util.toast('Pick at least one topic'); return; }
        const count = parseInt(el.querySelector('#sd-count').value, 10);
        const secs = Math.max(15, parseInt(el.querySelector('#sd-timer').value, 10) || 90);
        st.settings.timer = secs;
        st.settings.excludeFit = !topics.includes('fit');
        IB.store.save();
        IB.go(`#/study?mode=superday&run=1&n=${count}&t=${secs}&topics=${topics.join(',')}`);
      }
    });
    paint();
  }

  /* ───────── Flashcard session (daily + drill) ───────── */
  function session(el, queue, title) {
    const total = queue.length;
    let done = 0, again = 0, revealed = false, current = null;

    if (!total) {
      el.innerHTML = `<div class="card empty"><div class="big">✓</div><h2>Nothing to review right now</h2>
        <p>You're caught up. Try drilling a topic or a mock superday.</p>
        <div class="row" style="justify-content:center"><a class="btn primary" href="#/study?mode=drill">Drill a topic</a><a class="btn" href="#/study?mode=superday">Mock superday</a></div></div>`;
      return null;
    }

    function paint() {
      if (!queue.length) return finish();
      current = IB.srs.byId(queue[0]);
      if (!current) { queue.shift(); return paint(); }
      revealed = false;
      const isNew = IB.srs.isNew(current.id);
      el.innerHTML = `
        <div class="session-head">
          <a class="btn ghost sm" href="#/study" aria-label="End session">✕</a>
          <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><span style="width:${done / total * 100}%"></span></div>
          <span class="small muted num">${done}/${total}</span>
        </div>
        <div class="small muted" style="margin-bottom:8px">${esc(title)}</div>
        <article class="card flash" aria-live="polite">
          <div class="meta">${metaChips(current)}${isNew ? '<span class="chip good">New</span>' : ''}</div>
          <div class="q">${esc(current.q)}</div>
          <div id="ans"></div>
          <div class="prompt" id="prompt">Answer out loud first, then reveal. <span class="kbd">Space</span></div>
        </article>
        <div id="controls"><button class="btn primary block" data-act="reveal">Reveal answer</button></div>`;
    }

    function reveal() {
      if (revealed) return;
      revealed = true;
      const p = IB.srs.preview(current.id);
      el.querySelector('#ans').innerHTML = `<div class="answer">${md(current.a)}${current.tip ? `<div class="tip"><b>Tip · </b>${IB.util.inline(current.tip)}</div>` : ''}</div>`;
      el.querySelector('#prompt').remove();
      el.querySelector('#controls').innerHTML = `
        <div class="small muted">How did you do?</div>
        <div class="rate">
          <button class="btn again" data-rate="0">Again<small>${intervalLabel(p[0])} · <span class="kbd">1</span></small></button>
          <button class="btn hard" data-rate="1">Hard<small>${intervalLabel(p[1])} · <span class="kbd">2</span></small></button>
          <button class="btn good" data-rate="2">Good<small>${intervalLabel(p[2])} · <span class="kbd">3</span></small></button>
          <button class="btn easy" data-rate="3">Easy<small>${intervalLabel(p[3])} · <span class="kbd">4</span></small></button>
        </div>`;
    }

    function rate(r) {
      if (!revealed) return;
      IB.srs.review(current.id, r);
      const id = queue.shift();
      if (r === 0) {
        again++;
        // Bring missed cards back later in this same session.
        queue.splice(Math.min(queue.length, 3), 0, id);
      } else {
        done++; // every card leaves the queue with exactly one non-Again rating
      }
      paint();
    }

    function finish() {
      current = null;
      el.innerHTML = `<div class="card empty"><div class="big">🎯</div><h2>Session complete</h2>
        <p>${total} card${total === 1 ? '' : 's'} reviewed${again ? ` · ${again} miss${again === 1 ? '' : 'es'} repeated until you got them` : ''}.</p>
        <div class="row" style="justify-content:center"><a class="btn primary" href="#/home">Back to home</a><a class="btn" href="#/study">Study more</a></div></div>`;
    }

    el.addEventListener('click', e => {
      const b = e.target.closest('[data-act="reveal"], [data-rate]');
      if (!b) return;
      if (b.dataset.act === 'reveal') reveal(); else rate(parseInt(b.dataset.rate, 10));
    });
    const onKey = e => {
      if (!current || e.target.matches('input, textarea, select')) return;
      if ((e.key === ' ' || e.key === 'Enter') && !revealed) { e.preventDefault(); reveal(); }
      else if (revealed && /^[1-4]$/.test(e.key)) rate(parseInt(e.key, 10) - 1);
    };
    document.addEventListener('keydown', onKey);
    paint();
    return () => document.removeEventListener('keydown', onKey);
  }

  /* ───────── Mock superday ───────── */
  function superday(el, queue, seconds) {
    const total = queue.length;
    const results = [];
    let idx = 0, revealed = false, started = 0, elapsed = 0, timer = null;

    if (!total) {
      el.innerHTML = '<div class="card empty"><h2>No questions match those topics.</h2><a class="btn" href="#/study?mode=superday">Back</a></div>';
      return null;
    }

    function tick() {
      const left = seconds - Math.floor((Date.now() - started) / 1000);
      const t = el.querySelector('#timer');
      if (!t) return;
      const abs = Math.abs(left);
      t.textContent = (left < 0 ? '+' : '') + Math.floor(abs / 60) + ':' + String(abs % 60).padStart(2, '0');
      t.classList.toggle('low', left <= 10 && left >= 0);
      t.classList.toggle('over', left < 0);
    }

    function paint() {
      if (idx >= total) return finish();
      const q = IB.srs.byId(queue[idx]);
      revealed = false;
      started = Date.now();
      el.innerHTML = `
        <div class="session-head">
          <a class="btn ghost sm" href="#/study?mode=superday" aria-label="End mock">✕</a>
          <div class="progress"><span style="width:${idx / total * 100}%"></span></div>
          <span class="small muted num">${idx + 1}/${total}</span>
        </div>
        <div class="row between" style="margin-bottom:8px">
          <span class="small muted">Mock superday · answer out loud</span>
          <span class="timer" id="timer" aria-live="off"></span>
        </div>
        <article class="card flash">
          <div class="meta"><span class="chip accent">${esc(topicName(q.t))}</span></div>
          <div class="q">${esc(q.q)}</div>
          <div id="ans"></div>
          <div class="prompt" id="prompt">Speak your answer, then stop the clock. <span class="kbd">Space</span></div>
        </article>
        <div id="controls"><button class="btn primary block" data-act="reveal">Done, show answer</button></div>`;
      tick();
      clearInterval(timer);
      timer = setInterval(tick, 250);
    }

    function reveal() {
      if (revealed) return;
      revealed = true;
      clearInterval(timer);
      elapsed = (Date.now() - started) / 1000;
      const q = IB.srs.byId(queue[idx]);
      el.querySelector('#ans').innerHTML = `<div class="answer">${md(q.a)}${q.tip ? `<div class="tip"><b>Tip · </b>${IB.util.inline(q.tip)}</div>` : ''}</div>`;
      el.querySelector('#prompt').textContent = `You took ${Math.round(elapsed)}s.`;
      el.querySelector('#controls').innerHTML = `
        <div class="small muted">Compared with the model answer:</div>
        <div class="rate three">
          <button class="btn again" data-grade="0">Missed<small><span class="kbd">1</span></small></button>
          <button class="btn hard" data-grade="1">Shaky<small><span class="kbd">2</span></small></button>
          <button class="btn good" data-grade="2">Nailed it<small><span class="kbd">3</span></small></button>
        </div>`;
    }

    function grade(g) {
      if (!revealed) return;
      const id = queue[idx];
      results.push({ id, grade: g, seconds: elapsed });
      IB.srs.review(id, g); // Missed → Again, Shaky → Hard, Nailed → Good
      idx++;
      paint();
    }

    function finish() {
      clearInterval(timer);
      const count = g => results.filter(r => r.grade === g).length;
      const summary = {
        at: Date.now(), total, nailed: count(2), shaky: count(1), missed: count(0),
        avgSeconds: results.reduce((s, r) => s + r.seconds, 0) / results.length
      };
      const st = IB.store.get();
      st.superdays.push(summary);
      st.superdays = st.superdays.slice(-30);
      IB.store.save();
      const label = ['Missed', 'Shaky', 'Nailed'];
      const cls = ['bad', 'warn', 'good'];
      const ordered = results.slice().sort((a, b) => a.grade - b.grade);
      el.innerHTML = `
        <div class="page-head"><h1>Mock superday results</h1><p>${summary.nailed}/${total} nailed · average ${Math.round(summary.avgSeconds)}s per answer (target ${seconds}s)</p></div>
        <div class="grid cols-3" style="margin-bottom:16px">
          <div class="stat"><div class="label">Nailed</div><div class="value" style="color:var(--good)">${summary.nailed}</div></div>
          <div class="stat"><div class="label">Shaky</div><div class="value" style="color:var(--warn)">${summary.shaky}</div></div>
          <div class="stat"><div class="label">Missed</div><div class="value" style="color:var(--bad)">${summary.missed}</div></div>
        </div>
        <div class="card">
          <h2>Review your answers</h2>
          ${ordered.map(r => {
            const q = IB.srs.byId(r.id);
            return `<details class="lib-item"><summary><span class="qtext">${esc(q.q)}</span>
              <span class="chip ${cls[r.grade]}">${label[r.grade]}</span>
              <span class="tags"><span class="chip">${esc(topicName(q.t))}</span><span class="chip">${Math.round(r.seconds)}s${r.seconds > seconds ? ' · over' : ''}</span></span></summary>
              <div class="lib-answer">${md(q.a)}</div></details>`;
          }).join('')}
        </div>
        <div class="row"><a class="btn primary" href="#/study?mode=superday">Run another</a><a class="btn" href="#/home">Home</a></div>`;
    }

    el.addEventListener('click', e => {
      const b = e.target.closest('[data-act="reveal"], [data-grade]');
      if (!b) return;
      if (b.dataset.act === 'reveal') reveal(); else grade(parseInt(b.dataset.grade, 10));
    });
    const onKey = e => {
      if (idx >= total || e.target.matches('input, textarea, select')) return;
      if ((e.key === ' ' || e.key === 'Enter') && !revealed) { e.preventDefault(); reveal(); }
      else if (revealed && /^[1-3]$/.test(e.key)) grade(parseInt(e.key, 10) - 1);
    };
    document.addEventListener('keydown', onKey);
    paint();
    return () => { clearInterval(timer); document.removeEventListener('keydown', onKey); };
  }

  return {
    render(root, params) {
      const el = document.createElement('div');
      root.replaceChildren(el);
      const mode = params.mode;
      if (mode === 'daily' && params.run) return session(el, dailyQueue(), 'Daily review');
      if (mode === 'drill' && params.topic) return session(el, drillQueue(params.topic), 'Drill · ' + topicName(params.topic));
      if (mode === 'superday' && params.run) {
        const topics = (params.topics || '').split(',').filter(Boolean);
        const n = Math.max(1, parseInt(params.n, 10) || 10);
        const secs = Math.max(15, parseInt(params.t, 10) || 90);
        return superday(el, superdayQueue(topics.length ? topics : IB.TOPICS.map(t => t.id), n), secs);
      }
      chooser(el, mode);
      return null;
    }
  };
})();

</script>
  <script>
/* js/views/library.js */
/*
 * Library: browse/search every question, and manage your own questions
 * (added here, imported from JSON, or loaded from data/private-questions.js).
 */
window.IB = window.IB || {};
IB.views = IB.views || {};

IB.views.library = (function () {
  const { esc, md } = IB.util;
  const filters = { text: '', topic: '', source: '', status: '' };

  const topicName = id => (IB.TOPICS.find(t => t.id === id) || { name: id }).name;
  const isClass = s => /^sib/.test(s);

  function matches(q) {
    if (filters.topic && q.t !== filters.topic) return false;
    if (filters.source === 'class' && !isClass(q.s)) return false;
    if (filters.source === 'core' && q.s !== 'core') return false;
    if (filters.source === 'mine' && q.s !== 'mine' && q.s !== 'private') return false;
    if (filters.status && IB.srs.status(q.id) !== filters.status) return false;
    if (filters.text) {
      const hay = (q.q + ' ' + q.a + ' ' + (q.tip || '')).toLowerCase();
      if (!filters.text.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  }

  function item(q) {
    const s = IB.srs.status(q.id);
    const c = IB.srs.card(q.id);
    const statusLabel = { new: 'New', learning: 'Learning', mastered: 'Mastered' }[s];
    const next = c && c.due ? new Date(c.due).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
    return `<details class="lib-item" data-id="${esc(q.id)}">
      <summary>
        <span class="qtext">${esc(q.q)}</span>
        <span class="status-dot ${s}" title="${statusLabel}" aria-label="${statusLabel}"></span>
        <span class="tags"><span class="chip">${esc(topicName(q.t))}</span><span class="chip">${esc(IB.SOURCES[q.s] || q.s)}</span>
          ${c ? `<span class="chip">${statusLabel}${c.lapses ? ` · ${c.lapses} miss${c.lapses === 1 ? '' : 'es'}` : ''}${next ? ' · next ' + next : ''}</span>` : ''}</span>
      </summary>
      <div class="lib-answer">${md(q.a)}${q.tip ? `<div class="tip"><b>Tip · </b>${IB.util.inline(q.tip)}</div>` : ''}
        ${q.s === 'mine' ? `<div class="row" style="margin-top:10px"><button class="btn sm" data-edit="${esc(q.id)}">Edit</button><button class="btn sm danger" data-del="${esc(q.id)}">Delete</button></div>` : ''}
      </div>
    </details>`;
  }

  function formHtml(q) {
    q = q || {};
    return `<form id="qform" class="stack">
      <input type="hidden" name="id" value="${esc(q.id || '')}">
      <div class="grid cols-2 collapse">
        <label class="field">Topic<select name="t">${IB.TOPICS.map(t => `<option value="${t.id}" ${q.t === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></label>
        <label class="field">Difficulty<select name="d">${[[1, 'Basic'], [2, 'Intermediate'], [3, 'Advanced']].map(([v, l]) => `<option value="${v}" ${(q.d || 2) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      </div>
      <label class="field">Question<textarea name="q" required rows="2">${esc(q.q || '')}</textarea></label>
      <label class="field">Answer <span class="muted" style="font-weight:400">(start a line with "- " for bullets, **bold** for emphasis)</span><textarea name="a" required rows="6">${esc(q.a || '')}</textarea></label>
      <label class="field">Tip (optional)<input type="text" name="tip" value="${esc(q.tip || '')}"></label>
      <div class="row" style="justify-content:flex-end">
        <button type="button" class="btn ghost" data-act="cancel">Cancel</button>
        <button class="btn primary">${q.id ? 'Save changes' : 'Add question'}</button>
      </div>
    </form>`;
  }

  return {
    render(root) {
      const el = document.createElement('div');
      root.replaceChildren(el);
      const st = IB.store.get();
      const privCount = (IB.PRIVATE_QUESTIONS || []).length;

      el.innerHTML = `
        <div class="page-head row between">
          <div><h1>Library</h1><p>Every question in your bank. Tap one to see the answer.</p></div>
          <button class="btn primary" data-act="add">+ Add question</button>
        </div>
        <div class="card" id="editor" hidden></div>
        <div class="card">
          <div class="grid cols-4" style="margin-bottom:6px">
            <label class="field" style="grid-column:span 2">Search<input type="search" id="f-text" placeholder="e.g. goodwill, WACC, catch-up" value="${esc(filters.text)}"></label>
            <label class="field">Topic<select id="f-topic"><option value="">All topics</option>${IB.TOPICS.map(t => `<option value="${t.id}" ${filters.topic === t.id ? 'selected' : ''}>${esc(t.short)}</option>`).join('')}</select></label>
            <label class="field">Status<select id="f-status">${[['', 'Any status'], ['new', 'New'], ['learning', 'Learning'], ['mastered', 'Mastered']].map(([v, l]) => `<option value="${v}" ${filters.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
          </div>
          <div class="seg" id="f-source" role="group" aria-label="Source">
            ${[['', 'All'], ['class', 'From class'], ['core', 'Core'], ['mine', 'Mine']].map(([v, l]) => `<button data-v="${v}" class="${filters.source === v ? 'on' : ''}">${l}</button>`).join('')}
          </div>
          <div class="small muted" id="count" style="margin-top:10px"></div>
          <div id="list"></div>
        </div>
        <details class="card">
          <summary style="cursor:pointer;font-weight:700">Bulk import your own questions</summary>
          <div class="stack" style="margin-top:12px">
            <p class="small muted">Import a JSON array like <code>[{"t":"dcf","q":"…","a":"…"}]</code>. Topic ids: ${IB.TOPICS.map(t => `<code>${t.id}</code>`).join(' ')}.
            Imported questions are stored only in this browser (include them in your backup from Home → Settings).</p>
            <p class="small muted">To keep a larger set in files (e.g., notes from the 400 Questions guide), put them in <code>data/private-questions.js</code>. That file is gitignored, so it never gets pushed to GitHub. ${privCount ? `<span class="chip good">${privCount} loaded</span>` : '<span class="chip">not found</span>'}</p>
            <div class="row">
              <label class="btn">Import JSON<input type="file" accept="application/json,.json" id="bulk" hidden></label>
              <button class="btn" data-act="export-mine" ${st.custom.length ? '' : 'disabled'}>Export my ${st.custom.length} question${st.custom.length === 1 ? '' : 's'}</button>
            </div>
          </div>
        </details>`;

      const list = el.querySelector('#list');
      const editor = el.querySelector('#editor');

      const paint = () => {
        const qs = IB.srs.allQuestions().filter(matches);
        el.querySelector('#count').textContent = `${qs.length} question${qs.length === 1 ? '' : 's'}`;
        list.innerHTML = qs.length ? qs.map(item).join('') : '<div class="empty">No questions match.</div>';
      };

      const openEditor = q => {
        editor.hidden = false;
        editor.innerHTML = `<h2>${q ? 'Edit question' : 'Add your own question'}</h2>` + formHtml(q);
        editor.scrollIntoView({ behavior: 'smooth', block: 'start' });
        editor.querySelector('textarea[name="q"]').focus();
      };

      el.querySelector('#f-text').addEventListener('input', e => { filters.text = e.target.value.trim(); paint(); });
      el.querySelector('#f-topic').addEventListener('change', e => { filters.topic = e.target.value; paint(); });
      el.querySelector('#f-status').addEventListener('change', e => { filters.status = e.target.value; paint(); });
      el.querySelector('#f-source').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        filters.source = b.dataset.v;
        el.querySelectorAll('#f-source button').forEach(x => x.classList.toggle('on', x === b));
        paint();
      });

      el.addEventListener('submit', e => {
        if (e.target.id !== 'qform') return;
        e.preventDefault();
        const f = new FormData(e.target);
        const q = { t: f.get('t'), d: parseInt(f.get('d'), 10), q: f.get('q').trim(), a: f.get('a').trim() };
        if (f.get('tip').trim()) q.tip = f.get('tip').trim();
        const id = f.get('id');
        if (id) {
          const i = st.custom.findIndex(x => x.id === id);
          if (i >= 0) st.custom[i] = Object.assign({ id }, q);
        } else {
          st.custom.push(Object.assign({ id: 'my-' + Date.now().toString(36) }, q));
        }
        IB.store.save();
        editor.hidden = true;
        IB.util.toast(id ? 'Question updated' : 'Question added. It will show up as new in your reviews.');
        this.render(root);
      });

      el.addEventListener('click', e => {
        const t = e.target.closest('[data-act], [data-edit], [data-del]');
        if (!t) return;
        if (t.dataset.act === 'add') openEditor(null);
        else if (t.dataset.act === 'cancel') editor.hidden = true;
        else if (t.dataset.act === 'export-mine') IB.util.download('my-questions.json', JSON.stringify(st.custom.map(({ id, ...rest }) => rest), null, 2));
        else if (t.dataset.edit) openEditor(st.custom.find(q => q.id === t.dataset.edit));
        else if (t.dataset.del) {
          if (!confirm('Delete this question and its review history?')) return;
          st.custom = st.custom.filter(q => q.id !== t.dataset.del);
          delete st.cards[t.dataset.del];
          IB.store.save();
          this.render(root);
        }
      });

      el.querySelector('#bulk').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        file.text().then(text => {
          try {
            const arr = JSON.parse(text);
            if (!Array.isArray(arr)) throw new Error('Expected a JSON array of questions.');
            const valid = new Set(IB.TOPICS.map(t => t.id));
            let added = 0;
            arr.forEach((x, i) => {
              if (!x || !x.q || !x.a) return;
              const topic = valid.has(x.t) ? x.t : 'valuation';
              st.custom.push({ id: 'my-' + Date.now().toString(36) + '-' + i, t: topic, d: [1, 2, 3].includes(x.d) ? x.d : 2, q: String(x.q), a: String(x.a), tip: x.tip ? String(x.tip) : undefined });
              added++;
            });
            IB.store.save();
            IB.util.toast(`Imported ${added} question${added === 1 ? '' : 's'}`);
            this.render(root);
          } catch (err) { alert('Could not import: ' + err.message); }
        });
      });

      paint();
      return null;
    }
  };
})();

</script>
  <script>
/* js/views/statements.js */
/*
 * Three-statement simulator: pick a scenario, predict the impact, then see
 * every line of the income statement, cash flow statement and balance sheet.
 *
 * Each scenario returns only the lines it touches. Cash on the balance sheet
 * is derived from the cash flow statement, and the engine checks A = L + E.
 */
window.IB = window.IB || {};
IB.views = IB.views || {};

IB.views.statements = (function () {
  const { esc, signed, num, pick } = IB.util;

  // Small helpers for scenarios that flow through net income.
  const ni = (X, t, sign) => sign * (1 - t) * X;

  const SCENARIOS = [
    { id: 'dep', name: 'Depreciation increases', text: X => `Depreciation expense increases by $${X}.`,
      calc(X, t) { const n = ni(X, t, -1); return {
        is: [['Depreciation expense', X], ['Operating income (EBIT)', -X], ['Taxes', -t * X]], ni: n,
        cfo: [['Net income', n], ['Depreciation (add-back)', X]],
        assets: [['PP&E', -X]], equity: [['Retained earnings', n]],
        note: 'Depreciation is non-cash, so the only cash effect is the tax saving (depreciation × tax rate).' }; } },

    { id: 'amort', name: 'Amortization of intangibles', text: X => `The company records $${X} of amortization on acquired intangible assets (assume tax-deductible).`,
      calc(X, t) { const n = ni(X, t, -1); return {
        is: [['Amortization expense', X], ['Operating income (EBIT)', -X], ['Taxes', -t * X]], ni: n,
        cfo: [['Net income', n], ['Amortization (add-back)', X]],
        assets: [['Intangible assets', -X]], equity: [['Retained earnings', n]],
        note: 'Works exactly like depreciation, but for intangible assets.' }; } },

    { id: 'capex-cash', name: 'Buy PP&E with cash', text: X => `The company buys $${X} of equipment with cash.`,
      calc(X) { return {
        is: [], ni: 0, cfi: [['Capital expenditures', -X]],
        assets: [['PP&E', X]],
        note: 'CapEx is not an expense when incurred. It hits the income statement later, through depreciation.' }; } },

    { id: 'capex-debt', name: 'Buy PP&E with debt', text: X => `The company buys $${X} of equipment, funded entirely with new debt.`,
      calc(X) { return {
        is: [], ni: 0, cfi: [['Capital expenditures', -X]], cff: [['Debt issued', X]],
        assets: [['PP&E', X]], liab: [['Debt', X]],
        note: 'Cash goes out in investing and comes back in financing, so net cash is unchanged.' }; } },

    { id: 'inv-cash', name: 'Buy inventory with cash', text: X => `The company buys $${X} of inventory and pays cash.`,
      calc(X) { return {
        is: [], ni: 0, cfo: [['Increase in inventory', -X]],
        assets: [['Inventory', X]],
        note: 'No expense until the inventory is sold (then it becomes COGS). An increase in a current asset is a use of cash.' }; } },

    { id: 'inv-ap', name: 'Buy inventory on credit', text: X => `The company buys $${X} of inventory from a supplier on credit (accounts payable).`,
      calc(X) { return {
        is: [], ni: 0, cfo: [['Increase in inventory', -X], ['Increase in accounts payable', X]],
        assets: [['Inventory', X]], liab: [['Accounts payable', X]],
        note: 'The inventory increase (use of cash) is offset by the A/P increase (source of cash).' }; } },

    { id: 'sell-inv', name: 'Sell inventory for cash', text: X => `The company sells inventory that cost $${X} to customers for $${1.5 * X} in cash.`,
      calc(X, t) { const ebit = 0.5 * X; const n = (1 - t) * ebit; return {
        is: [['Revenue', 1.5 * X], ['Cost of goods sold', X], ['Operating income (EBIT)', ebit], ['Taxes', t * ebit]], ni: n,
        cfo: [['Net income', n], ['Decrease in inventory', X]],
        assets: [['Inventory', -X]], equity: [['Retained earnings', n]],
        note: 'COGS is non-cash here (the cash went out when the inventory was bought), so the inventory decrease is added back.' }; } },

    { id: 'rev-credit', name: 'Revenue on credit', text: X => `The company delivers $${X} of services on credit (no associated costs); the customer has not paid yet.`,
      calc(X, t) { const n = ni(X, t, 1); return {
        is: [['Revenue', X], ['Operating income (EBIT)', X], ['Taxes', t * X]], ni: n,
        cfo: [['Net income', n], ['Increase in accounts receivable', -X]],
        assets: [['Accounts receivable', X]], equity: [['Retained earnings', n]],
        note: 'Revenue is earned but not collected, so A/R reverses it on the CFS. Cash falls by the taxes owed on that revenue (assuming taxes are paid in cash).' }; } },

    { id: 'collect-ar', name: 'Collect receivables', text: X => `A customer pays $${X} of an outstanding receivable.`,
      calc(X) { return {
        is: [], ni: 0, cfo: [['Decrease in accounts receivable', X]],
        assets: [['Accounts receivable', -X]],
        note: 'The revenue was already recognized. This just converts A/R into cash.' }; } },

    { id: 'deferred', name: 'Customer prepays (deferred revenue)', text: X => `A customer pays $${X} upfront for a service you will deliver next year.`,
      calc(X) { return {
        is: [], ni: 0, cfo: [['Increase in deferred revenue', X]],
        liab: [['Deferred revenue', X]],
        note: 'Cash in today, but no revenue until the service is delivered. Deferred revenue is a liability.' }; } },

    { id: 'prepaid', name: 'Prepay an expense', text: X => `The company prepays $${X} in cash for next year's insurance.`,
      calc(X) { return {
        is: [], ni: 0, cfo: [['Increase in prepaid expenses', -X]],
        assets: [['Prepaid expenses', X]],
        note: 'The expense is recognized next year as the insurance is used up. Today it is just cash converted into a prepaid asset.' }; } },

    { id: 'accrued', name: 'Accrue a bonus (paid next year)', text: X => `The company records a $${X} employee bonus that it will pay next year.`,
      calc(X, t) { const n = ni(X, t, -1); return {
        is: [['Operating expenses', X], ['Operating income (EBIT)', -X], ['Taxes', -t * X]], ni: n,
        cfo: [['Net income', n], ['Increase in accrued expenses', X]],
        assets: [], liab: [['Accrued expenses', X]], equity: [['Retained earnings', n]],
        note: 'The expense hits now but cash has not gone out, so cash rises by the tax saving (assuming the expense is deductible this year).' }; } },

    { id: 'issue-debt', name: 'Issue debt', text: X => `The company borrows $${X}.`,
      calc(X) { return { is: [], ni: 0, cff: [['Debt issued', X]], liab: [['Debt', X]],
        note: 'Pure financing: no income statement impact until interest accrues.' }; } },

    { id: 'repay-debt', name: 'Repay debt principal', text: X => `The company repays $${X} of debt principal.`,
      calc(X) { return { is: [], ni: 0, cff: [['Debt repaid', -X]], liab: [['Debt', -X]],
        note: 'Principal repayment is not an expense, only interest is.' }; } },

    { id: 'interest', name: 'Pay interest', text: X => `The company pays $${X} of interest in cash.`,
      calc(X, t) { const n = ni(X, t, -1); return {
        is: [['Interest expense', X], ['Pre-tax income', -X], ['Taxes', -t * X]], ni: n,
        cfo: [['Net income', n]],
        equity: [['Retained earnings', n]],
        note: 'Interest is tax-deductible, so the after-tax cost is interest × (1 − t). Interest sits in operating cash flow under US GAAP.' }; } },

    { id: 'issue-stock', name: 'Issue shares', text: X => `The company issues $${X} of new common stock.`,
      calc(X) { return { is: [], ni: 0, cff: [['Stock issued', X]], equity: [['Common stock & APIC', X]],
        note: 'Cash and equity both rise. No income statement impact.' }; } },

    { id: 'buyback', name: 'Buy back shares', text: X => `The company repurchases $${X} of its own stock.`,
      calc(X) { return { is: [], ni: 0, cff: [['Share repurchases', -X]], equity: [['Treasury stock', -X]],
        note: 'Treasury stock is a contra-equity account, so equity falls.' }; } },

    { id: 'dividend', name: 'Pay a dividend', text: X => `The company pays a $${X} cash dividend.`,
      calc(X) { return { is: [], ni: 0, cff: [['Dividends paid', -X]], equity: [['Retained earnings', -X]],
        note: 'Dividends are a distribution of profit, not an expense, so they never touch the income statement.' }; } },

    { id: 'sbc', name: 'Stock-based compensation', text: X => `The company grants $${X} of stock-based compensation to employees.`,
      calc(X, t) { const n = ni(X, t, -1); return {
        is: [['Stock-based compensation', X], ['Operating income (EBIT)', -X], ['Taxes', -t * X]], ni: n,
        cfo: [['Net income', n], ['Stock-based comp (add-back)', X]],
        equity: [['Retained earnings', n], ['Common stock & APIC', X]],
        note: 'Non-cash, so it is added back, but shareholders are diluted. Equity rises by the tax saving because the shares issued offset the hit to retained earnings.' }; } },

    { id: 'ppe-writedown', name: 'Write down PP&E', text: X => `The company writes down $${X} of PP&E (assume the write-down is tax-deductible).`,
      calc(X, t) { const n = ni(X, t, -1); return {
        is: [['Asset write-down', X], ['Operating income (EBIT)', -X], ['Taxes', -t * X]], ni: n,
        cfo: [['Net income', n], ['Write-down (add-back)', X]],
        assets: [['PP&E', -X]], equity: [['Retained earnings', n]],
        note: 'Same mechanics as depreciation: a non-cash charge whose only cash effect is the tax saving.' }; } },

    { id: 'inv-writedown', name: 'Write down inventory', text: X => `The company writes down $${X} of obsolete inventory (assume tax-deductible).`,
      calc(X, t) { const n = ni(X, t, -1); return {
        is: [['Inventory write-down (in COGS)', X], ['Operating income (EBIT)', -X], ['Taxes', -t * X]], ni: n,
        cfo: [['Net income', n], ['Write-down (add-back)', X]],
        assets: [['Inventory', -X]], equity: [['Retained earnings', n]],
        note: 'Some guides show this through the change in inventory instead of a separate add-back. Either way, cash rises by the tax saving.' }; } },

    { id: 'sell-ppe', name: 'Sell PP&E at book value', text: X => `The company sells equipment with a book value of $${X} for $${X} in cash.`,
      calc(X) { return { is: [], ni: 0, cfi: [['Proceeds from asset sale', X]], assets: [['PP&E', -X]],
        note: 'No gain or loss because the price equals book value. With a gain, you would subtract it in operations (to avoid double counting) and show the full proceeds in investing.' }; } }
  ];

  const session = { tried: 0, right: 0 };
  let current = { id: 'dep', X: 10, t: 0.4 };

  function build(s, X, t) {
    const r = s.calc(X, t);
    ['is', 'cfo', 'cfi', 'cff', 'assets', 'liab', 'equity'].forEach(k => { r[k] = r[k] || []; });
    const sum = rows => rows.reduce((a, [, v]) => a + v, 0);
    r.cfoTotal = sum(r.cfo); r.cfiTotal = sum(r.cfi); r.cffTotal = sum(r.cff);
    r.cash = r.cfoTotal + r.cfiTotal + r.cffTotal;
    r.assets = [['Cash', r.cash]].concat(r.assets);
    r.totalAssets = sum(r.assets);
    r.totalLE = sum(r.liab) + sum(r.equity);
    return r;
  }

  const round2 = v => Math.round(v * 100) / 100;
  const cellCls = v => (Math.abs(v) < 1e-9 ? '' : v > 0 ? 'pos' : 'neg');
  const rowsHtml = rows => rows.map(([l, v]) => `<tr><td>${esc(l)}</td><td class="${cellCls(v)}">${signed(round2(v), 2)}</td></tr>`).join('');

  function statementsHtml(r) {
    const isRows = r.is.length
      ? rowsHtml(r.is) + `<tr class="total"><td>Net income</td><td class="${cellCls(r.ni)}">${signed(round2(r.ni), 2)}</td></tr>`
      : '<tr><td colspan="2" class="muted" style="text-align:left">No impact</td></tr>';
    const section = (title, rows, total, totalLabel) => rows.length
      ? `<tr class="section"><td colspan="2">${title}</td></tr>${rowsHtml(rows)}<tr class="sub"><td>${totalLabel}</td><td>${signed(round2(total), 2)}</td></tr>` : '';
    const balanced = Math.abs(r.totalAssets - r.totalLE) < 1e-6;
    return `<div class="statements">
      <div class="card"><h3>Income statement</h3><div class="table-wrap"><table class="fin"><tbody>${isRows}</tbody></table></div></div>
      <div class="card"><h3>Cash flow statement</h3><div class="table-wrap"><table class="fin"><tbody>
        ${section('Operating', r.cfo, r.cfoTotal, 'Cash from operations')}
        ${section('Investing', r.cfi, r.cfiTotal, 'Cash from investing')}
        ${section('Financing', r.cff, r.cffTotal, 'Cash from financing')}
        <tr class="total"><td>Net change in cash</td><td class="${cellCls(r.cash)}">${signed(round2(r.cash), 2)}</td></tr>
      </tbody></table></div></div>
      <div class="card"><h3>Balance sheet</h3><div class="table-wrap"><table class="fin"><tbody>
        <tr class="section"><td colspan="2">Assets</td></tr>${rowsHtml(r.assets)}
        <tr class="total"><td>Total assets</td><td class="${cellCls(r.totalAssets)}">${signed(round2(r.totalAssets), 2)}</td></tr>
        ${r.liab.length ? `<tr class="section"><td colspan="2">Liabilities</td></tr>${rowsHtml(r.liab)}` : ''}
        ${r.equity.length ? `<tr class="section"><td colspan="2">Equity</td></tr>${rowsHtml(r.equity)}` : ''}
        <tr class="total"><td>Total liabilities + equity</td><td class="${cellCls(r.totalLE)}">${signed(round2(r.totalLE), 2)}</td></tr>
      </tbody></table></div>
      <div class="balance-check ${balanced ? 'ok' : 'off'}" style="margin-top:10px">${balanced ? '✓ Balance sheet balances' : '✕ Does not balance'}</div></div>
    </div>`;
  }

  function walkthrough(r) {
    const f = v => signed(round2(v), 2);
    const lines = [];
    lines.push(r.is.length
      ? `<strong>Income statement:</strong> ${r.is.map(([l, v]) => `${esc(l)} ${f(v)}`).join(', ')}, so net income <strong>${f(r.ni)}</strong>.`
      : '<strong>Income statement:</strong> no impact.');
    const cfs = [].concat(r.cfo, r.cfi, r.cff).filter(([, v]) => Math.abs(v) > 1e-9);
    lines.push(`<strong>Cash flow statement:</strong> ${cfs.length ? cfs.map(([l, v]) => `${esc(l)} ${f(v)}`).join(', ') : 'no flows'}, so cash <strong>${f(r.cash)}</strong>.`);
    const le = [].concat(r.liab, r.equity);
    lines.push(`<strong>Balance sheet:</strong> ${r.assets.filter(([, v]) => Math.abs(v) > 1e-9).map(([l, v]) => `${esc(l)} ${f(v)}`).join(', ') || 'no asset change'} (assets ${f(r.totalAssets)}); ` +
      `${le.length ? le.map(([l, v]) => `${esc(l)} ${f(v)}`).join(', ') : 'no change in liabilities or equity'} (L + E ${f(r.totalLE)}).`);
    return `<ol class="steps">${lines.map(l => `<li>${l}</li>`).join('')}</ol>`;
  }

  return {
    SCENARIOS,
    build,
    render(root) {
      const el = document.createElement('div');
      root.replaceChildren(el);

      el.innerHTML = `
        <div class="page-head row between">
          <div><h1>Three-statement simulator</h1><p>Predict the impact, then check every line. This is the "walk me through" question, drilled.</p></div>
          <span class="chip accent num" id="score"></span>
        </div>
        <div class="card stack">
          <div class="grid cols-4">
            <label class="field" style="grid-column:span 2">Scenario
              <select id="sc">${SCENARIOS.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label>
            <label class="field">Amount ($)<input type="number" id="amt" min="1" step="1"></label>
            <label class="field">Tax rate (%)<input type="number" id="tax" min="0" max="60" step="1"></label>
          </div>
          <div class="row"><button class="btn" data-act="random">🎲 Random scenario</button></div>
          <p id="prompt" style="font-size:1.1rem;font-weight:650;margin:0"></p>
          <div class="grid cols-3">
            <label class="field">Δ Net income<input type="text" inputmode="decimal" id="p-ni" placeholder="e.g. -6"></label>
            <label class="field">Δ Cash<input type="text" inputmode="decimal" id="p-cash" placeholder="e.g. 4"></label>
            <label class="field">Δ Total assets<input type="text" inputmode="decimal" id="p-assets" placeholder="e.g. -6"></label>
          </div>
          <div class="row" style="justify-content:flex-end">
            <button class="btn ghost" data-act="show">Just show me</button>
            <button class="btn primary" data-act="check">Check</button>
          </div>
          <div id="verdicts" class="grid cols-3"></div>
        </div>
        <div id="out"></div>`;

      const $ = s => el.querySelector(s);

      function load() {
        $('#sc').value = current.id;
        $('#amt').value = current.X;
        $('#tax').value = Math.round(current.t * 100);
        const s = SCENARIOS.find(x => x.id === current.id);
        $('#prompt').textContent = s.text(current.X) + ` Tax rate ${Math.round(current.t * 100)}%.`;
        ['#p-ni', '#p-cash', '#p-assets'].forEach(k => { $(k).value = ''; });
        $('#verdicts').innerHTML = '';
        $('#out').innerHTML = '';
        $('#score').textContent = session.tried ? `${session.right}/${session.tried} correct` : '';
      }

      function reveal(checked) {
        const s = SCENARIOS.find(x => x.id === current.id);
        const r = build(s, current.X, current.t);
        if (checked) {
          const tests = [['Net income', '#p-ni', r.ni], ['Cash', '#p-cash', r.cash], ['Total assets', '#p-assets', r.totalAssets]];
          let all = true;
          $('#verdicts').innerHTML = tests.map(([label, sel, truth]) => {
            const raw = $(sel).value.trim();
            const guess = raw === '' ? NaN : num(raw.replace(/[−–]/g, '-'), NaN);
            const ok = isFinite(guess) && Math.abs(guess - round2(truth)) < 0.011;
            if (!ok) all = false;
            return `<div class="verdict ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✕'} ${label}: ${signed(round2(truth), 2)}${!ok && raw ? ` <span class="small">(you: ${esc(raw)})</span>` : ''}</div>`;
          }).join('');
          session.tried++;
          if (all) session.right++;
          $('#score').textContent = `${session.right}/${session.tried} correct`;
        }
        $('#out').innerHTML = statementsHtml(r) +
          `<div class="card" style="margin-top:12px"><h3>Walk-through</h3>${walkthrough(r)}<div class="tip"><b>Key point · </b>${esc(r.note)}</div>
           <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn primary" data-act="random">Next scenario →</button></div></div>`;
      }

      el.addEventListener('change', e => {
        if (e.target.id === 'sc') current.id = e.target.value;
        else if (e.target.id === 'amt') current.X = Math.max(1, num(e.target.value, 10));
        else if (e.target.id === 'tax') current.t = Math.min(0.6, Math.max(0, num(e.target.value, 40) / 100));
        else return;
        load();
      });
      el.addEventListener('click', e => {
        const a = e.target.closest('[data-act]');
        if (!a) return;
        if (a.dataset.act === 'random') {
          const others = SCENARIOS.filter(s => s.id !== current.id);
          current = { id: pick(others).id, X: pick([10, 20, 50, 100]), t: pick([0.2, 0.25, 0.4]) };
          load();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (a.dataset.act === 'check') reveal(true);
        else if (a.dataset.act === 'show') reveal(false);
      });
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.target.matches('#p-ni, #p-cash, #p-assets')) { e.preventDefault(); reveal(true); }
      });

      load();
      return null;
    }
  };
})();

</script>
  <script>
/* js/views/valuation.js */
/*
 * Valuation lab: DCF, WACC builder, LBO and quick interview math.
 * The math lives in js/calc.js; this file is inputs and presentation.
 */
window.IB = window.IB || {};
IB.views = IB.views || {};

IB.views.valuation = (function () {
  const { esc, fmt, pct, mult, num, pick } = IB.util;

  /* Inputs are kept in display units (% as 9 not 0.09) for the life of the page. */
  const S = {
    tab: 'dcf',
    dcf: { rev0: 1000, growth: 6, years: 5, margin: 20, tax: 25, daPct: 4, capexPct: 5, nwcPct: 10, wacc: 9, tvMethod: 'perp', g: 2.5, exitMult: 10, cash: 100, debt: 400, shares: 50 },
    wacc: { rf: 4.5, mrp: 4, betaE: 1.2, deComp: 0.5, tax: 25, deTarget: 0.5, rd: 6 },
    lbo: null,
    quick: { type: 'mixed', right: 0, tried: 0 }
  };
  const LBO_DEFAULT = { ebitda0: 100, entryMult: 10, feesPct: 2, debtMult: 6, rate: 8, growth: 6, years: 5, exitMult: 10, tax: 25, daPct: 20, capexPct: 20, nwcPct: 10, mode: 'sweep', repay1: 4, step: 0.5, exitCash: 10 };
  const LBO_BOWL = { ebitda0: 10, entryMult: 15, feesPct: 0, debtMult: 7.5, rate: 5, growth: +((Math.pow(1.5, 0.2) - 1) * 100).toFixed(4), years: 5, exitMult: 15, tax: 25, daPct: 10, capexPct: 5, nwcPct: 5, mode: 'schedule', repay1: 4, step: 0.5, exitCash: 10 };
  S.lbo = Object.assign({}, LBO_DEFAULT);

  const field = (group, key, label, unit, step) => {
    const v = S[group][key];
    return `<label class="field">${esc(label)}${unit ? ` <span class="muted" style="font-weight:400">(${unit})</span>` : ''}
      <input type="number" data-g="${group}" data-k="${key}" value="${v}" step="${step || 'any'}"></label>`;
  };

  const flagList = items => items.length ? `<ul class="flags">${items.map(w => `<li><span class="chip warn">!</span><span>${esc(w)}</span></li>`).join('')}</ul>` : '';

  /* ───────── DCF ───────── */
  function dcfParams() {
    const d = S.dcf;
    return {
      rev0: d.rev0, growth: d.growth / 100, years: Math.max(1, Math.min(15, Math.round(d.years))), margin: d.margin / 100,
      tax: d.tax / 100, daPct: d.daPct / 100, capexPct: d.capexPct / 100, nwcPct: d.nwcPct / 100,
      wacc: d.wacc / 100, tvMethod: d.tvMethod, g: d.g / 100, exitMult: d.exitMult, cash: d.cash, debt: d.debt, shares: d.shares
    };
  }

  function dcfInputs() {
    const d = S.dcf;
    return `<div class="card"><div class="form-grid">
      <h3>Operating assumptions</h3>
      ${field('dcf', 'rev0', 'Last-year revenue', '$')}
      ${field('dcf', 'growth', 'Revenue growth', '%/yr')}
      ${field('dcf', 'years', 'Explicit period', 'years', 1)}
      ${field('dcf', 'margin', 'EBIT margin', '%')}
      ${field('dcf', 'tax', 'Tax rate', '%')}
      ${field('dcf', 'daPct', 'D&A', '% revenue')}
      ${field('dcf', 'capexPct', 'CapEx', '% revenue')}
      ${field('dcf', 'nwcPct', 'NWC investment', '% Δ revenue')}
      <h3>Discounting &amp; terminal value</h3>
      ${field('dcf', 'wacc', 'WACC', '%')}
      <label class="field">Terminal value method
        <select data-g="dcf" data-k="tvMethod"><option value="perp" ${d.tvMethod === 'perp' ? 'selected' : ''}>Perpetuity growth</option><option value="mult" ${d.tvMethod === 'mult' ? 'selected' : ''}>Exit EV/EBITDA multiple</option></select></label>
      ${d.tvMethod === 'perp' ? field('dcf', 'g', 'Perpetuity growth', '%') : field('dcf', 'exitMult', 'Exit multiple', 'x EBITDA')}
      <h3>Bridge to equity</h3>
      ${field('dcf', 'cash', 'Cash', '$')}
      ${field('dcf', 'debt', 'Debt + pref + NCI', '$')}
      ${field('dcf', 'shares', 'Diluted shares', '#')}
    </div></div>`;
  }

  function dcfOutputs() {
    const p = dcfParams();
    const r = IB.calc.dcf(p);
    const yrs = r.rows;
    const line = (label, key, opts) => `<tr class="${(opts && opts.cls) || ''}"><td>${label}</td>${yrs.map(x => `<td>${opts && opts.dp === 3 ? x[key].toFixed(3) : fmt((opts && opts.neg ? -1 : 1) * x[key])}</td>`).join('')}</tr>`;

    const isPerp = p.tvMethod === 'perp';
    const wSteps = [-0.01, -0.005, 0, 0.005, 0.01];
    const cSteps = isPerp ? [-0.01, -0.005, 0, 0.005, 0.01] : [-2, -1, 0, 1, 2];
    const metric = p.shares > 0 ? 'perShare' : 'equity';
    const sens = wSteps.map(dw => cSteps.map(dc => {
      const q = Object.assign({}, p, { wacc: p.wacc + dw });
      if (isPerp) q.g = p.g + dc; else q.exitMult = p.exitMult + dc;
      return IB.calc.dcf(q)[metric];
    }));
    const colLabel = dc => isPerp ? pct(p.g + dc, 1) : mult(p.exitMult + dc, 1);

    return `
      <div class="card">
        <div class="kpis">
          <div class="kpi"><div class="label">Enterprise value</div><div class="value">${fmt(r.ev, 0)}</div></div>
          <div class="kpi"><div class="label">Equity value</div><div class="value">${fmt(r.equity, 0)}</div></div>
          <div class="kpi hero"><div class="label">Value per share</div><div class="value">${p.shares > 0 ? '$' + fmt(r.perShare, 2) : '–'}</div></div>
          <div class="kpi"><div class="label">TV share of EV</div><div class="value">${pct(r.tvShare, 0)}</div></div>
        </div>
        <p class="small muted" style="margin:10px 0 0">${isPerp
          ? `Implied exit multiple: <strong>${mult(r.impliedMult)}</strong> final-year EBITDA.`
          : `Implied perpetuity growth: <strong>${pct(r.impliedG, 1)}</strong>.`}
          EV = PV of FCFF ${fmt(r.sumPV, 0)} + PV of TV ${fmt(r.pvTV, 0)}. Equity = EV + cash − debt.</p>
        ${r.warnings.length ? `<div style="margin-top:10px">${flagList(r.warnings)}</div>` : ''}
      </div>
      <div class="card"><h2>Free cash flow to the firm</h2>
        <div class="table-wrap"><table class="fin">
          <thead><tr><th>Year</th>${yrs.map(x => `<th>${x.year}</th>`).join('')}</tr></thead>
          <tbody>
            ${line('Revenue', 'rev')}
            ${line('EBIT', 'ebit')}
            ${line('NOPLAT = EBIT × (1 − t)', 'nopat')}
            ${line('+ D&amp;A', 'da', { cls: 'sub' })}
            ${line('− Δ NWC', 'dnwc', { cls: 'sub', neg: true })}
            ${line('− CapEx', 'capex', { cls: 'sub', neg: true })}
            ${line('FCFF', 'fcff', { cls: 'total' })}
            ${line('Discount factor', 'df', { cls: 'sub', dp: 3 })}
            ${line('PV of FCFF', 'pv')}
          </tbody>
        </table></div>
        <p class="small muted" style="margin:8px 0 0">Terminal value at year ${p.years}: ${fmt(r.tv, 0)} = ${isPerp ? `FCFF<sub>${p.years + 1}</sub> / (WACC − g)` : `EBITDA<sub>${p.years}</sub> × ${mult(p.exitMult)}`}, discounted by (1 + WACC)<sup>${p.years}</sup>.</p>
      </div>
      <div class="card"><h2>Sensitivity: ${p.shares > 0 ? 'value per share' : 'equity value'}</h2>
        <div class="table-wrap"><table class="fin sens">
          <thead><tr><th>WACC ↓ / ${isPerp ? 'g' : 'exit multiple'} →</th>${cSteps.map(dc => `<th>${colLabel(dc)}</th>`).join('')}</tr></thead>
          <tbody>${wSteps.map((dw, i) => `<tr><th style="text-align:left">${pct(p.wacc + dw, 1)}</th>${sens[i].map((v, j) => `<td class="${dw === 0 && cSteps[j] === 0 ? 'base' : ''}">${metric === 'perShare' ? fmt(v, 2) : fmt(v, 0)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
      </div>`;
  }

  /* ───────── WACC ───────── */
  function waccInputs() {
    return `<div class="card"><div class="form-grid">
      <h3>Cost of equity (CAPM)</h3>
      ${field('wacc', 'rf', 'Risk-free rate', '%')}
      ${field('wacc', 'mrp', 'Market risk premium', '%')}
      <h3>Beta from a comparable</h3>
      ${field('wacc', 'betaE', 'Comparable equity beta', 'β')}
      ${field('wacc', 'deComp', 'Comparable D/E', 'ratio')}
      ${field('wacc', 'tax', 'Tax rate', '%')}
      <h3>Your company</h3>
      ${field('wacc', 'deTarget', 'Target D/E', 'ratio')}
      ${field('wacc', 'rd', 'Pre-tax cost of debt', '%')}
    </div></div>`;
  }

  function waccOutputs() {
    const w = S.wacc;
    const t = w.tax / 100;
    const r = IB.calc.wacc({ rf: w.rf / 100, mrp: w.mrp / 100, betaE: w.betaE, deComp: w.deComp, tax: t, deTarget: w.deTarget, rd: w.rd / 100 });
    const f3 = v => v.toFixed(3);
    return `
      <div class="card">
        <div class="kpis">
          <div class="kpi"><div class="label">Asset beta</div><div class="value">${f3(r.betaA)}</div></div>
          <div class="kpi"><div class="label">Relevered beta</div><div class="value">${f3(r.betaL)}</div></div>
          <div class="kpi"><div class="label">Cost of equity</div><div class="value">${pct(r.re, 2)}</div></div>
          <div class="kpi hero"><div class="label">WACC</div><div class="value">${pct(r.wacc, 2)}</div></div>
        </div>
        <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" data-act="use-wacc">Use ${pct(r.wacc, 2)} in the DCF →</button></div>
      </div>
      <div class="card"><h2>Step by step</h2>
        <ol class="steps">
          <li><strong>Unlever</strong> the comparable: β<sub>a</sub> = β<sub>e</sub> / [1 + (1 − t) × D/E] = ${w.betaE} / [1 + ${fmt(1 - t, 2)} × ${w.deComp}] = <strong>${f3(r.betaA)}</strong></li>
          <li><strong>Relever</strong> at your target D/E: β<sub>e</sub> = ${f3(r.betaA)} × [1 + ${fmt(1 - t, 2)} × ${w.deTarget}] = <strong>${f3(r.betaL)}</strong></li>
          <li><strong>CAPM:</strong> r<sub>e</sub> = ${w.rf}% + ${f3(r.betaL)} × ${w.mrp}% = <strong>${pct(r.re, 2)}</strong></li>
          <li><strong>Weights</strong> from D/E = ${w.deTarget}: D/V = ${pct(r.dv, 1)}, E/V = ${pct(r.ev, 1)}</li>
          <li><strong>After-tax cost of debt:</strong> ${w.rd}% × (1 − ${fmt(t, 2)}) = ${pct(r.rdAfter, 2)}</li>
          <li><strong>WACC</strong> = ${pct(r.ev, 1)} × ${pct(r.re, 2)} + ${pct(r.dv, 1)} × ${pct(r.rdAfter, 2)} = <strong>${pct(r.wacc, 2)}</strong></li>
        </ol>
        <p class="small muted" style="margin:8px 0 0">Assumes β<sub>debt</sub> = 0, as in class. In practice you unlever several comparables and use the median asset beta.</p>
      </div>`;
  }

  /* ───────── LBO ───────── */
  function lboParams(over) {
